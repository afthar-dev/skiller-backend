name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 10.17.1
  NODE_VERSION: 24

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # Shadow database for `prisma migrate diff`; the test suites start their own containers (Testcontainers).
      shadow-db:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: shadow
          POSTGRES_DB: shadow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Only used by `prisma validate` / `generate` / `migrate diff`; nothing here connects to a real database.
      DATABASE_URL: postgresql://postgres:shadow@localhost:5432/shadow
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            edge/playback-gate/pnpm-lock.yaml

      - name: Install
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir edge/playback-gate install --frozen-lockfile
          pnpm prisma generate

      - name: Lint (includes module-boundary rules)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Prisma schema is valid and migrations match it
        run: |
          pnpm prisma validate
          # prisma migrate diff from the migrations to the schema, minus Prisma's known raw-ops index false positives
          node scripts/check-schema-drift.mjs
          pnpm test:scripts

      - name: Unit tests
        run: pnpm test

      - name: Integration tests
        run: pnpm test:int --forceExit

      - name: E2E tests
        run: pnpm test:e2e --forceExit

      - name: Edge (playback gate) tests
        run: pnpm test:edge

      - name: OpenAPI spec is up to date
        run: |
          pnpm openapi:export
          git diff --exit-code openapi.json

      - name: Every operation has a typed response (the untyped allowlist may only shrink)
        run: pnpm openapi:check-responses

  docker:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: smoke
          POSTGRES_DB: skiller
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Production-mode smoke environment: dummy secrets and endpoints, real Postgres / Redis from the service containers.
      SMOKE_ENV: >-
        -e NODE_ENV=production
        -e DATABASE_URL=postgresql://postgres:smoke@localhost:5432/skiller
        -e REDIS_URL=redis://localhost:6379
        -e JWT_SECRET=smoke-secret-0123456789abcdef0123456789abcdef
        -e OTP_PEPPER=smoke-secret-0123456789abcdef0123456789abcdef
        -e PLAYBACK_SECRET=smoke-secret-0123456789abcdef0123456789abcdef
        -e CORS_ORIGINS=https://app.skiller.test
        -e WEB_BASE_URL=https://app.skiller.test
        -e COOKIE_DOMAIN=skiller.test
        -e R2_ACCOUNT_ID=smoke
        -e R2_ACCESS_KEY_ID=smoke
        -e R2_SECRET_ACCESS_KEY=smoke
        -e R2_PUBLIC_BUCKET=skiller-public
        -e R2_PRIVATE_BUCKET=skiller-private
        -e R2_PUBLIC_BASE_URL=https://media.skiller.test
        -e R2_PLAYBACK_BASE_URL=https://play.skiller.test
        -e RESEND_API_KEY=re_smoke
        -e RESEND_FROM_ADDRESS=no-reply@skiller.test
        -e RESEND_WEBHOOK_SECRET=whsec_dGVzdHNlY3JldA==
        -e RAZORPAY_KEY_ID=rzp_test_smoke
        -e RAZORPAY_KEY_SECRET=smoke
        -e RAZORPAY_WEBHOOK_SECRET=smoke
        -e RAZORPAYX_ACCOUNT_NUMBER=2323230000000001
        -e RAZORPAYX_WEBHOOK_SECRET=smoke-x
        -e SUPER_ADMIN_EMAIL=admin@skiller.test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: skiller-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          load: true
          tags: skiller-worker:ci
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      # Boots the images that would be deployed: catches import-order / module-graph failures that only show up in the compiled build.
      - name: Release (migrate + seed) with the API image
        run: docker run --rm --network host $SMOKE_ENV skiller-api:ci npm run release:seed
      - name: Smoke - API answers /v1/health and /v1/ready
        run: |
          docker run -d --name api --network host $SMOKE_ENV -e PORT=4000 skiller-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:4000/v1/health; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:4000/v1/health
          curl -fsS http://localhost:4000/v1/ready
      - name: Smoke - worker starts every queue worker
        run: |
          docker run -d --name worker --network host $SMOKE_ENV skiller-worker:ci
          for i in $(seq 1 30); do
            if docker logs worker 2>&1 | grep -q "workers started"; then break; fi
            sleep 2
          done
          docker logs worker 2>&1 | grep "workers started" | grep -q "outbox" && docker logs worker 2>&1 | grep "workers started" | grep -q "media-transcode"
      - name: Container logs on failure
        if: failure()
        run: |
          docker logs api || true
          docker logs worker || true

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 10.17.1
  NODE_VERSION: 24

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # Shadow database for `prisma migrate diff`; the test suites start their own containers (Testcontainers).
      shadow-db:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: shadow
          POSTGRES_DB: shadow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Only used by `prisma validate` / `generate` / `migrate diff`; nothing here connects to a real database.
      DATABASE_URL: postgresql://postgres:shadow@localhost:5432/shadow
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            edge/playback-gate/pnpm-lock.yaml

      - name: Install
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir edge/playback-gate install --frozen-lockfile
          pnpm prisma generate

      - name: Lint (includes module-boundary rules)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Prisma schema is valid and migrations match it
        run: |
          pnpm prisma validate
          # prisma migrate diff from the migrations to the schema, minus Prisma's known raw-ops index false positives
          node scripts/check-schema-drift.mjs

      - name: Unit tests
        run: pnpm test

      - name: Integration tests
        run: pnpm test:int --forceExit

      - name: E2E tests
        run: pnpm test:e2e --forceExit

      - name: Edge (playback gate) tests
        run: pnpm test:edge

      - name: OpenAPI spec is up to date
        run: |
          pnpm openapi:export
          git diff --exit-code openapi.json

  docker:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build worker image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          push: false
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

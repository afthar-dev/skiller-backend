# FREE DEMO Blueprint (for showing the client, NOT for real users or real money).
# One free web service runs the database update, the API and the worker together (Dockerfile.demo, scripts/start-demo.sh).
# Free Render limits: the service sleeps after ~15 min without visitors (first visit then takes ~1 min),
# Redis keeps nothing across restarts (everyone is signed out), 512 MB memory (keep demo videos short).
# Production uses render.yaml instead. Steps: DEPLOYMENT.md, Part 7.
envVarGroups:
  - name: skiller-demo-shared
    envVars:
      - key: NODE_ENV
        value: production
      # Neon POOLED url (the app). Migrations use DIRECT_DATABASE_URL below.
      - key: DATABASE_URL
        sync: false
      # Neon DIRECT url, used only by the API's pre-deploy migration step.
      - key: DIRECT_DATABASE_URL
        sync: false
      # Random 44-character values generated by Render on first apply. Rotating JWT_SECRET signs everyone out.
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_PEPPER
        generateValue: true
      - key: KYC_PEPPER
        generateValue: true
      # Must equal the playback gate's secret (edge/playback-gate, `wrangler secret put PLAYBACK_SECRET`).
      - key: PLAYBACK_SECRET
        sync: false
      # Must equal SSR_SHARED_SECRET on the web app's host. 32+ characters.
      - key: SSR_SHARED_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: https://skiller.in
      - key: WEB_BASE_URL
        value: https://skiller.in
      - key: API_BASE_URL
        value: https://api.skiller.in
      - key: COOKIE_DOMAIN
        value: .skiller.in
      # Render's own proxy sits in front of the service. Confirm logged IPs are real visitors (HOSTING.md 3.5).
      - key: TRUST_PROXY
        value: "1"
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_PUBLIC_BUCKET
        value: skiller-public
      - key: R2_PRIVATE_BUCKET
        value: skiller-private
      - key: R2_PUBLIC_BASE_URL
        value: https://cdn.skiller.in
      - key: R2_PLAYBACK_BASE_URL
        value: https://play.skiller.in
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_ADDRESS
        value: Skiller <hello@mail.skiller.in>
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAYX_ACCOUNT_NUMBER
        sync: false
      # Must differ from RAZORPAY_WEBHOOK_SECRET or the API refuses to start.
      - key: RAZORPAYX_WEBHOOK_SECRET
        sync: false
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SENTRY_DSN
        sync: false

services:
  - type: keyvalue
    name: skiller-demo-redis
    region: singapore
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: [] # private network only

  - type: web
    name: skiller-demo-api
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile.demo
    dockerContext: .
    healthCheckPath: /v1/health
    domains:
      - api.skiller.in
    envVars:
      - key: PORT
        value: "4000"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: skiller-demo-redis
          property: connectionString
      - fromGroup: skiller-demo-shared

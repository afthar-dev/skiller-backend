# Render Blueprint: API, worker and Redis (Key Value). Postgres stays on Neon; files on Cloudflare R2.
# Full steps: docs/HOSTING.md section 3.5. Values marked `sync: false` are asked for when the Blueprint is
# first applied and are never stored in this file. Never commit a secret here.
envVarGroups:
  - name: skiller-shared
    envVars:
      - key: NODE_ENV
        value: production
      # Neon POOLED url (the app). Migrations use DIRECT_DATABASE_URL below.
      - key: DATABASE_URL
        sync: false
      # Neon DIRECT url, used only by the API's pre-deploy migration step.
      - key: DIRECT_DATABASE_URL
        sync: false
      # Random 44-character values generated by Render on first apply. Rotating JWT_SECRET signs everyone out.
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_PEPPER
        generateValue: true
      - key: KYC_PEPPER
        generateValue: true
      # Must equal the playback gate's secret (edge/playback-gate, `wrangler secret put PLAYBACK_SECRET`).
      - key: PLAYBACK_SECRET
        sync: false
      # Must equal SSR_SHARED_SECRET on the web app's host. 32+ characters.
      - key: SSR_SHARED_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: https://skiller.in
      - key: WEB_BASE_URL
        value: https://skiller.in
      - key: API_BASE_URL
        value: https://api.skiller.in
      - key: COOKIE_DOMAIN
        value: .skiller.in
      # Render's own proxy sits in front of the service. Confirm logged IPs are real visitors (HOSTING.md 3.5).
      - key: TRUST_PROXY
        value: "1"
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_PUBLIC_BUCKET
        value: skiller-public
      - key: R2_PRIVATE_BUCKET
        value: skiller-private
      - key: R2_PUBLIC_BASE_URL
        value: https://cdn.skiller.in
      - key: R2_PLAYBACK_BASE_URL
        value: https://play.skiller.in
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_ADDRESS
        value: Skiller <hello@mail.skiller.in>
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAYX_ACCOUNT_NUMBER
        sync: false
      # Must differ from RAZORPAY_WEBHOOK_SECRET or the API refuses to start.
      - key: RAZORPAYX_WEBHOOK_SECRET
        sync: false
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SENTRY_DSN
        sync: false

services:
  # Redis 7. noeviction is required: an evicting policy can revive revoked sessions and drop queue jobs.
  # Paid plans keep data on disk across restarts; the free plan does not, so don't use it.
  - type: keyvalue
    name: skiller-redis
    region: singapore
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: [] # private network only

  - type: web
    name: skiller-api
    runtime: docker
    region: singapore
    plan: standard # 2 GB. Free plans sleep, which breaks live message streams.
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Time to finish in-flight requests and close live message streams before Render kills the process after SIGTERM.
    maxShutdownDelaySeconds: 60
    # Liveness only. /v1/ready also checks Neon and Redis, so a database blip would make Render restart healthy instances. Use /v1/ready for deploy checks and monitors.
    healthCheckPath: /v1/health
    # Migrate with the direct (non-pooled) Neon url before each release goes live.
    preDeployCommand: sh -c 'DATABASE_URL="$DIRECT_DATABASE_URL" npm run release'
    domains:
      - api.skiller.in
    envVars:
      - key: PORT
        value: "4000"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: skiller-redis
          property: connectionString
      - fromGroup: skiller-shared

  # BullMQ jobs incl. the ffmpeg video transcoder. No public address.
  - type: worker
    name: skiller-worker
    runtime: docker
    region: singapore
    plan: standard # 2 GB minimum for transcoding
    dockerfilePath: ./Dockerfile.worker
    dockerContext: .
    # On SIGTERM the worker stops taking jobs and waits for running ones (a lesson transcode can take many minutes). 300 is Render's maximum;
    # a job still running after that is stalled and re-run, so keep it short of that or accept the redo.
    maxShutdownDelaySeconds: 300
    envVars:
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: skiller-redis
          property: connectionString
      - fromGroup: skiller-shared
